<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hot Dog Prof. Pardal</title><style>
:root{--r:#b91c1c;--g:#15803d;--bg:#fff7ed;--line:#eadfd8}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#211a17}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:3}.w{max-width:900px;margin:auto;padding:14px}.top,.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:900}.muted{color:#75665f;font-size:13px}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--r);color:#fff;font-weight:800;cursor:pointer}.sec{background:#f3e8e3;color:#211a17}.green{background:var(--g)}nav{display:flex;gap:8px;overflow:auto;margin-top:10px}.screen{display:none}.screen.on{display:block}.tabs{display:flex;gap:8px;margin-bottom:12px}.item{background:#fff;border-top:1px solid var(--line);padding:14px 4px}.price{font-size:19px;font-weight:900;color:var(--r)}.cartline{border-bottom:1px solid var(--line);padding:12px 0}.field{display:grid;gap:5px;margin:9px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #d8cbc5;border-radius:10px;font:inherit}.box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;padding:18px;border-radius:22px 22px 0 0}.check{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #eee}.check input{width:auto}.err{background:#fff1f2;color:#991b1b;padding:10px;border-radius:10px;display:none}.err.on{display:block}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}</style></head><body>
<header><div class="w"><div class="top"><div><div class="brand">🌭 Hot Dog Prof. Pardal</div><div class="muted">Cardápio e pedidos</div></div></div><nav><button class="btn" onclick="show('menu')">Cardápio</button><button class="btn sec" onclick="show('cart')">🛒 Carrinho <span id="cc">0</span> · <span id="ct">R$ 0,00</span></button><button class="btn sec" onclick="show('orders')">Meu pedido</button></nav></div></header>
<main class="w"><section id="menu" class="screen on"><div id="notice"></div><h2>Cardápio</h2><div class="tabs"><button class="btn" onclick="cat='Hot Dogs';menu()">🌭 Hot Dogs</button><button class="btn sec" onclick="cat='Bebidas';menu()">🥤 Bebidas</button></div><div id="list">Carregando...</div></section>
<section id="cart" class="screen"><h2>Carrinho</h2><div id="cartList"></div><div class="box"><div id="err" class="err"></div><div class="field"><label>Nome *</label><input id="name" autocomplete="name"></div><div class="field"><label>WhatsApp *</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>Recebimento *</label><select id="type" onchange="addr.style.display=this.value==='Entrega'?'block':'none'"><option>Entrega</option><option>Retirada</option></select></div><div id="addr"><div class="field"><label>Rua *</label><input id="street"></div><div class="row"><div class="field" style="flex:1"><label>Número *</label><input id="number"></div><div class="field" style="flex:2"><label>Bairro *</label><input id="neighborhood"></div></div><div class="row"><div class="field" style="flex:2"><label>Cidade *</label><input id="city"></div><div class="field" style="width:90px"><label>UF *</label><input id="state" maxlength="2"></div></div><div class="field"><label>Complemento</label><input id="complement"></div><div class="field"><label>Referência</label><input id="reference"></div></div><div class="field"><label>Pagamento *</label><select id="payment"><option>PIX</option><option>Cartão na entrega</option><option>Dinheiro</option></select></div><div class="row"><b>Total</b><b id="total">R$ 0,00</b></div><button id="send" class="btn green" style="width:100%;margin-top:12px" onclick="finish()">Confirmar pedido</button></div></section>
<section id="orders" class="screen"><h2>Meu pedido</h2><div id="myorders"></div></section></main>
<div id="modal" class="modal"><div class="sheet"><div class="row"><h2 id="mt"></h2><button class="btn sec" onclick="modal.classList.remove('on')">Fechar</button></div><div id="mb"></div><div class="field"><label>Quantidade</label><input id="qty" type="number" min="1" value="1"></div><div class="field"><label>Observação</label><textarea id="obs"></textarea></div><button class="btn green" style="width:100%" onclick="add()">Adicionar ao carrinho</button></div></div>
<script>
const U='https://retdpzrjxpfycfouvdax.supabase.co',K='sb_publishable_qPDTks7tEajw5ry4IalBow_5slyS-rq';let P=[],I=[],C=[],E=[],D=[],PD=[],cart=[],cat='Hot Dogs',sel=null,last=JSON.parse(localStorage.getItem('pardal-last')||'null');const $=id=>document.getElementById(id),money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(t){let r=await fetch(U+'/rest/v1/'+t+'?select=*',{headers:{apikey:K}});if(!r.ok)throw Error('Falha ao carregar cardápio');return r.json()}
async function boot(){try{[P,I,C,E,D,PD,S]=await Promise.all(['products','ingredients','product_composition','product_extras','drink_options','product_drink_options','app_settings'].map(get));let st=Object.fromEntries(S.map(x=>[x.key,x.value]));if(st.notice_enabled&&st.notice_text)$('notice').innerHTML='<div class="box">'+esc(st.notice_text)+'</div>';if(st.delivery_open===false)$('notice').innerHTML+='<div class="box"><b>🔴 Delivery fechado no momento.</b><div class="muted">O cardápio continua disponível para consulta.</div></div>';window.openDelivery=st.delivery_open!==false;menu()}catch(e){$('list').innerHTML='<div class="box">Não foi possível carregar o cardápio. Tente novamente.</div>'}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');renderCart();renderOrders()}
function available(p){return p.active!==false&&C.filter(x=>x.product_id===p.id).every(x=>I.find(i=>i.id===x.ingredient_id)?.active!==false)}
function menu(){let ps=P.filter(p=>cat==='Hot Dogs'?p.category==='Hot Dogs':['Sucos','Bebidas'].includes(p.category)).filter(available).sort((a,b)=>+a.price-+b.price);$('list').innerHTML=ps.map(p=>'<div class="item row"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.description||'')+'</div></div><div style="text-align:right"><div class="price">'+money(p.price)+'</div><button class="btn" onclick="openP('+p.id+')">Escolher</button></div></div>').join('')||'<div class="box">Nenhum produto disponível.</div>'}
function openP(id){sel=P.find(p=>p.id===id);$('mt').textContent=sel.name+' · '+money(sel.price);let comp=C.filter(x=>x.product_id===id&&x.removable!==false).map(x=>I.find(i=>i.id===x.ingredient_id)).filter(Boolean),ex=E.filter(x=>x.product_id===id&&x.active!==false).map(x=>({...x,i:I.find(i=>i.id===x.ingredient_id)})).filter(x=>x.i),opts=PD.filter(x=>x.product_id===id&&x.active!==false).map(x=>D.find(d=>d.id===x.drink_option_id)).filter(x=>x&&x.active!==false);let h='';if(comp.length)h+='<h3>Retirar ingredientes</h3>'+comp.map(i=>'<label class="check"><input class="rem" type="checkbox" value="'+esc(i.name)+'"> Sem '+esc(i.name)+'</label>').join('');if(ex.length)h+='<h3>Adicionais</h3>'+ex.map(x=>'<label class="check"><input class="extra" type="checkbox" data-name="'+esc(x.i.name)+'" data-price="'+x.price+'"> '+esc(x.i.name)+' (+'+money(x.price)+')</label>').join('');if(sel.category==='Sucos')h+='<div class="field"><label>Sabor</label><select id="flavor">'+I.filter(i=>i.category==='Sucos'&&i.active!==false).map(i=>'<option>'+esc(i.name)+'</option>').join('')+'</select></div><div class="field"><label>Açúcar</label><select id="sugar"><option>Normal</option><option>Pouco açúcar</option><option>Sem açúcar</option></select></div>';if(opts.length)h+='<div class="field"><label>Opção</label><select id="drinkOpt">'+opts.map(o=>'<option>'+esc(o.name)+'</option>').join('')+'</select></div>';$('mb').innerHTML=h;$('qty').value=1;$('obs').value='';$('modal').classList.add('on')}
function add(){let q=Math.max(1,parseInt($('qty').value)||1),extras=[...document.querySelectorAll('.extra:checked')].map(x=>x.dataset.name),extraTotal=[...document.querySelectorAll('.extra:checked')].reduce((a,x)=>a+(+x.dataset.price||0),0);cart.push({product:sel.name,qty:q,price:+sel.price+extraTotal,extras,remove:[...document.querySelectorAll('.rem:checked')].map(x=>x.value),flavor:$('flavor')?.value||null,sugar:$('sugar')?.value||null,drinkOption:$('drinkOpt')?.value||null,obs:$('obs').value.trim()});$('modal').classList.remove('on');renderCart()}
function renderCart(){let t=cart.reduce((a,x)=>a+x.price*x.qty,0);$('cc').textContent=cart.reduce((a,x)=>a+x.qty,0);$('ct').textContent=$('total').textContent=money(t);$('cartList').innerHTML=cart.map((x,n)=>'<div class="cartline row"><div><b>'+x.qty+'× '+esc(x.product)+'</b><div class="muted">'+[x.flavor,x.sugar,x.drinkOption,x.remove.length?'SEM: '+x.remove.join(', '):'',x.extras.length?'+ '+x.extras.join(', '):''].filter(Boolean).map(esc).join(' · ')+'</div></div><div><b>'+money(x.price*x.qty)+'</b> <button class="btn sec" onclick="cart.splice('+n+',1);renderCart()">×</button></div></div>').join('')||'<div class="box">Seu carrinho está vazio.</div>'}
async function finish(){let er=[];if(!window.openDelivery)er.push('O delivery está fechado.');if(!cart.length)er.push('Adicione um produto.');if(!$('name').value.trim())er.push('Informe seu nome.');if(!$('phone').value.trim())er.push('Informe seu WhatsApp.');if($('type').value==='Entrega'&&['street','number','neighborhood','city','state'].some(x=>!$(x).value.trim()))er.push('Complete o endereço de entrega.');if(er.length){$('err').innerHTML=er.join('<br>');$('err').classList.add('on');return}$('err').classList.remove('on');let address=$('type').value==='Entrega'?{street:$('street').value.trim(),number:$('number').value.trim(),neighborhood:$('neighborhood').value.trim(),city:$('city').value.trim(),state:$('state').value.trim().toUpperCase(),complement:$('complement').value.trim(),reference:$('reference').value.trim()}:null,payload={customer:$('name').value.trim(),phone:$('phone').value.trim(),type:$('type').value,payment:$('payment').value,address,items:cart};$('send').disabled=true;$('send').textContent='Enviando...';try{let r=await fetch(U+'/functions/v1/submit-order',{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Falha ao enviar');last={...d.order,customer:payload.customer,type:payload.type,items:cart};localStorage.setItem('pardal-last',JSON.stringify(last));cart=[];renderCart();show('orders')}catch(e){$('err').textContent=e.message;$('err').classList.add('on')}finally{$('send').disabled=false;$('send').textContent='Confirmar pedido'}}
function renderOrders(){$('myorders').innerHTML=last?'<div class="box"><div class="row"><h3>Pedido #'+last.id+'</h3><b>'+esc(last.status||'Novo')+'</b></div><div class="muted">'+esc(last.customer||'')+' · '+esc(last.type||'')+'</div><h3>Total: '+money(last.total)+'</h3></div>':'<div class="box">Nenhum pedido enviado neste aparelho.</div>'}boot();renderCart();
</script></body></html>
